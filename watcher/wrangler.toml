name = "coins-desk-watcher"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Start: 1-min cron. Follow-up: Durable Object ~15s alarm loop.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "DESK_STATE"
# Create with: npx wrangler kv namespace create DESK_STATE
# then paste id here
id = "560836cf68f3419183d0d93e41e4a184"
preview_id = "135a2522e0ee423bae8a686707bcdbcd"

[vars]
FILLS_URL = "https://raw.githubusercontent.com/sparkmediaai/coins-desk/a9e261c644ba714c72dcd29d2a578ad15ed5d4f1/fills.json"
LIQ_DROP_PCT = "0.30"
BUYER_STALL_ENABLED = "1"
BUYER_STALL_RATIO = "0.2"
BUYER_STALL_MIN_PEAK = "50"
GHOST_SCRUB = "1"
TRAIL_ARM_PCT = "0.20"
TRAIL_EXIT_PCT = "0.10"
FAST_DUMP_PCT = "0.15"
HARD_MINUS_PCT = "0.10"
TRAIL_ENABLED = "1"
SAVE_POINTS = "1"
DEDUPE_SECONDS = "180"

RIP_ENABLED = "1"
RIP_PLUS20_PCT = "0.20"
RIP_PLUS50_ENABLED = "0"
RIP_BENCH_ENABLED = "1"
RIP_BENCH_M5_PCT = "8"
RIP_BENCH_H1_PCT = "25"
RIP_BENCH_MIN_LIQ = "150000"
RIP_BENCH_MIN_AGE_H = "12"
RIP_BENCH_MAX_BUYS_1H = "2000"
RIP_BENCH_MAX_ALERTS = "3"
WATCH_DISCOVERY_ENABLED = "1"
WATCH_MIN_LIQ = "80000"
WATCH_MIN_AGE_H = "0.25"
WATCH_MAX_AGE_H = "72"
WATCH_MAX_BUYS_1H = "2500"
WATCH_MAX_ALERTS = "2"
RIP_BENCH_BUY_TILT = "1.15"
RIP_BENCH_LIQ_DROP_PCT = "0.35"
RIP_BENCH_MAX_SIZE = "25"
