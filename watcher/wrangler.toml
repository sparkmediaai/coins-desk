name = "coins-desk-watcher"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Start: 1-min cron. Follow-up: Durable Object ~15s alarm loop.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "DESK_STATE"
id = "560836cf68f3419183d0d93e41e4a184"
preview_id = "135a2522e0ee423bae8a686707bcdbcd"

[vars]
FILLS_URL = "https://sparkmediaai.github.io/coins-desk/fills.json"
LIQ_DROP_PCT = "0.25"
TRAIL_ARM_PCT = "0.20"
TRAIL_EXIT_PCT = "0.05"
FAST_DUMP_PCT = "0.15"
HARD_MINUS_PCT = "0.10"
TRAIL_ENABLED = "0"
SAVE_POINTS = "0"
DEDUPE_SECONDS = "180"
