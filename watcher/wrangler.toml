name = "coins-desk-watcher"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Start: 1-min cron. Follow-up: Durable Object ~15s alarm loop.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "DESK_STATE"
# Create with: npx wrangler kv namespace create DESK_STATE
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_NAMESPACE_PREVIEW_ID"

[vars]
FILLS_URL = "https://sparkmediaai.github.io/coins-desk/fills.json"
LIQ_DROP_PCT = "0.25"
TRAIL_ARM_PCT = "0.20"
TRAIL_EXIT_PCT = "0.05"
FAST_DUMP_PCT = "0.15"
HARD_MINUS_PCT = "0.10"
DEDUPE_SECONDS = "180"
