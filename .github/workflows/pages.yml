name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update Pages site (main /)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          body='{"source":{"branch":"main","path":"/"}}'
          hdr=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")

          post_code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" -X POST "${hdr[@]}" -d "$body" "$api")
          echo "POST /pages => ${post_code}"
          cat /tmp/pages-post.json
          echo

          if [ "$post_code" = "409" ] || [ "$post_code" = "422" ]; then
            patch_code=$(curl -sS -o /tmp/pages-patch.json -w "%{http_code}" -X PATCH "${hdr[@]}" -d "$body" "$api")
            echo "PATCH /pages => ${patch_code}"
            cat /tmp/pages-patch.json
            echo
          fi

          get_code=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" "${hdr[@]}" "$api")
          echo "GET /pages => ${get_code}"
          cat /tmp/pages-get.json
          echo

          python3 - <<'PY'
          import json
          from pathlib import Path
          files = ["pages-post", "pages-patch", "pages-get"]
          out = {}
          for name in files:
              p = Path(f"/tmp/{name}.json")
              if p.exists() and p.stat().st_size:
                  try:
                      out[name] = json.loads(p.read_text())
                  except Exception:
                      out[name] = p.read_text()
          Path("pages-api.json").write_text(json.dumps(out, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-api.json
          git diff --cached --quiet || git commit -m "Record Pages API response."
          git push origin HEAD:main

          html_url=$(python3 -c "import json; print(json.load(open('/tmp/pages-get.json')).get('html_url') or '')" || true)
          if [ -z "$html_url" ]; then
            echo "GET /pages did not return html_url"
            exit 1
          fi
          echo "html_url=${html_url}"
