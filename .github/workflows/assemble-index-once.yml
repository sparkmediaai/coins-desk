name: assemble-index-once
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/assemble-index-once.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate chunks into watcher/src/index.js
        run: |
          set -euo pipefail
          cat watcher/_assemble/part00.txt \
              watcher/_assemble/part01.txt \
              watcher/_assemble/part02.txt \
              watcher/_assemble/part03.txt \
              watcher/_assemble/part04.txt \
              watcher/_assemble/part05.txt > watcher/src/index.js
          python3 - <<'PY'
          import hashlib
          c = open("watcher/src/index.js", encoding="utf-8").read()
          assert len(c) == 39845, len(c)
          h = hashlib.sha256(c.encode()).hexdigest()
          assert h == "bc0f5b2db447dc4bdacd88a2272e89c0588a82c5e101a86eb35e2e670f055927", h
          print("assembled ok", len(c), h)
          PY
          rm -rf watcher/_assemble
          git config user.name "sparkmediaai"
          git config user.email "sparkmediaai@gmail.com"
          git add -A
          git status
          git commit -m "watcher: WATCH_NEW discovery + mint hygiene + RIP buy-tilt/liq gates"
          git push
