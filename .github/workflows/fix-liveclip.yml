name: fix-liveclip
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-liveclip.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore and patch app.js
        run: |
          set -euo pipefail
          git show fab279bbaa99a30c3a49161fee43f35d79edc50c:app.js > app.js
          echo  | base64 -d > /tmp/patch_liveclip.py
          python3 /tmp/patch_liveclip.py
          grep -n "num(pos.tokens)" app.js
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name sparkmediaai
          git config user.email sparkmediaai@gmail.com
          git add app.js
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "desk: liveClip accepts tokens field for curve fills"
          git push origin HEAD:main
